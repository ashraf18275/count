<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#17204f">
<title>ألغاز النجوم</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 0%,#5368cf 0,#222f78 40%,#101735 100%);display:flex;justify-content:center}.app{width:min(100%,520px);padding:18px 16px 30px;display:flex;flex-direction:column;align-items:center;min-height:100vh}.top{width:100%;display:flex;justify-content:space-between;align-items:center}.logo{font-size:1.08rem;font-weight:900;letter-spacing:.2px}.gear,.iconbtn{border:1px solid #ffffff44;background:#ffffff16;color:white;border-radius:14px;font-size:1.25rem;width:46px;height:46px}.hero{text-align:center;margin:15px 0 10px}.hero h1{font-size:1.8rem;margin:0 0 4px}.sub{margin:0;color:#dbe2ff;font-size:.92rem}.panel{width:100%;background:#ffffff12;border:1px solid #ffffff24;border-radius:20px;padding:13px;margin:9px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stat{background:#080f382e;border-radius:13px;padding:8px 3px}.stat small{display:block;color:#cbd5ff;font-size:.76rem}.stat strong{font-size:1.2rem}.mission{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem}.target{display:flex;align-items:center;gap:10px;font-weight:800}.target-symbol{font-size:2rem;background:#ffffff1c;border-radius:13px;width:52px;height:52px;display:grid;place-items:center}.progress{height:8px;background:#0b1239;border-radius:9px;overflow:hidden;margin-top:10px}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#69f0c2,#ffdf69);transition:width .2s}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:100%;margin:8px 0 12px}.tile{aspect-ratio:1;border:1px solid #ffffff35;border-radius:15px;background:linear-gradient(145deg,#ffffff20,#ffffff0a);color:#ffe16b;font-size:clamp(1.45rem,7vw,2.05rem);box-shadow:0 4px 0 #0b1239;display:grid;place-items:center;padding:0;touch-action:manipulation;transition:transform .1s,background .15s}.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #0b1239}.tile.good{background:#2dbb8b66;border-color:#8bffdb}.tile.bad{animation:shake .2s;border-color:#ff7d93}.tile:disabled{opacity:.65}.actions{display:flex;gap:9px;width:100%}.primary,.secondary{border:0;border-radius:15px;padding:14px 12px;font-weight:850;font-size:.98rem;flex:1}.primary{background:linear-gradient(135deg,#ffe98b,#ffc94f);color:#27244c;box-shadow:0 4px 0 #b17a24}.secondary{background:#ffffff16;color:#fff;border:1px solid #ffffff3b}.hint{color:#cbd4ff;font-size:.8rem;text-align:center;line-height:1.7;margin:14px 0 0}.overlay{position:fixed;inset:0;background:#070d2bed;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.dialog{width:min(100%,390px);max-height:88vh;overflow:auto;background:#fff;color:#1b2454;border-radius:24px;padding:22px;box-shadow:0 20px 70px #0008}.dialog h2{margin:0 0 8px}.dialog p{line-height:1.7}.setting{display:block;width:100%;text-align:right;padding:14px;margin:9px 0;border:1px solid #dce1f2;border-radius:14px;background:#f5f7ff;color:#202b70;font-weight:750;font-size:.98rem}.close{background:#e8eaf6}.levelgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.level{padding:12px 2px;border-radius:12px;border:1px solid #d7ddf1;background:#f5f7ff;color:#202b70;font-weight:800}.level.locked{opacity:.4}.level.current{background:#ffe58a;border-color:#e8bc39}.notice{font-size:.8rem;color:#687092;line-height:1.6}.result-icon{font-size:3.5rem;text-align:center;margin:5px}.pill{border-radius:999px;padding:5px 10px;background:#ffffff1a;font-size:.8rem;white-space:nowrap}@keyframes shake{25%{transform:translateX(3px)}75%{transform:translateX(-3px)}}@media(max-width:360px){.board{gap:6px}.tile{border-radius:11px}.panel{padding:10px}}
</style></head>
<body><main class="app">
<div class="top"><div class="logo">⭐ ألغاز النجوم</div><button class="gear" id="settings" aria-label="الإعدادات">⚙️</button></div>
<header class="hero"><h1>صيّاد النجوم</h1><p class="sub">ركّز، التقط الرمز المطلوب، وافتح مستويات جديدة!</p></header>
<section class="panel stats"><div class="stat"><small>النقاط</small><strong id="score">0</strong></div><div class="stat"><small>المستوى</small><strong id="levelLabel">1 / 12</strong></div><div class="stat"><small>أفضل نتيجة</small><strong id="best">0</strong></div></section>
<section class="panel"><div class="mission"><div class="target"><div class="target-symbol" id="target">★</div><div><div>اجمع الرمز المطلوب</div><small id="goalText">0 من 5 نجوم</small></div></div><div class="pill">⏱ <strong id="time">30</strong> ث</div></div><div class="progress"><span id="progress"></span></div></section>
<div class="board" id="board" aria-label="لوحة اللعب"></div>
<div class="actions"><button class="primary" id="start">ابدأ اللعب ▶</button><button class="secondary" id="levels">المستويات 🗺️</button></div>
<p class="hint" id="hint">في كل مستوى، التقط النجوم المطابقة للرمز الكبير قبل انتهاء الوقت. الخطأ يخصم ثانيتين.</p>
</main>
<div class="overlay" id="overlay"><div class="dialog" id="dialog"></div></div>
<script>
(()=>{'use strict';
const symbols=['★','✦','✧','✶','✷','✹'],$=id=>document.getElementById(id);
const state={score:0,level:1,best:Number(localStorage.getItem('star-hunter-best')||0),unlocked:Math.max(1,Number(localStorage.getItem('star-hunter-unlocked')||1)),goal:5,found:0,time:30,running:false,timer:null,target:'★',sound:localStorage.getItem('star-hunter-sound')!=='off',round:0};
const overlay=$('overlay'),dialog=$('dialog');let secretMode=false,secretFirst=0,secretSecond=0;
$('best').textContent=state.best;
function tone(freq=620,duration=.07){if(!state.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.type='sine';g.gain.value=.045;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+duration);o.stop(c.currentTime+duration);o.onended=()=>c.close()}catch(e){}}
function goalFor(l){return 5+Math.floor((l-1)*1.2)}
function timeFor(l){return Math.max(17,32-(l-1))}
function renderBoard(){const board=$('board');board.innerHTML='';const arr=Array.from({length:25},()=>symbols[Math.floor(Math.random()*symbols.length)]);let count=arr.filter(s=>s===state.target).length;while(count<Math.max(8,state.goal+2)){const i=Math.floor(Math.random()*arr.length);if(arr[i]!==state.target){arr[i]=state.target;count++}}arr.sort(()=>Math.random()-.5);if(secretMode){arr[0]='★';arr[5]='★'}arr.forEach((sym,index)=>{const b=document.createElement('button');b.className='tile';b.textContent=sym;b.setAttribute('aria-label','نجمة '+sym);b.addEventListener('click',()=>{if(secretMode){secretTap(index,b);return}tap(b,sym)});board.appendChild(b)})}
function update(){ $('score').textContent=state.score;$('levelLabel').textContent=state.level+' / 12';$('best').textContent=state.best;$('target').textContent=state.target;$('goalText').textContent=state.found+' من '+state.goal+' نجوم';$('time').textContent=state.time;$('progress').style.width=(100*state.found/state.goal)+'%'}
function setHint(t){$('hint').textContent=t}
function stop(){state.running=false;if(state.timer){clearInterval(state.timer);state.timer=null}document.querySelectorAll('.tile').forEach(b=>b.disabled=true)}
function start(){if(state.timer)clearInterval(state.timer);state.score=state.score||0;state.goal=goalFor(state.level);state.found=0;state.time=timeFor(state.level);state.target=symbols[(state.level-1)%symbols.length];state.running=true;state.round++;$('start').textContent='إعادة المستوى ↻';renderBoard();update();setHint('التقط '+state.goal+' من الرمز '+state.target+' قبل انتهاء الوقت!');state.timer=setInterval(()=>{if(!state.running)return;state.time--;update();if(state.time<=0)finish(false)},1000)}
function tap(btn,sym){if(!state.running||btn.disabled)return;if(sym===state.target){btn.disabled=true;btn.classList.add('good');btn.textContent='✓';state.found++;state.score+=10+state.level;tone(760,.06);if(state.score>state.best){state.best=state.score;localStorage.setItem('star-hunter-best',String(state.best))}update();if(state.found>=state.goal)finish(true)}else{btn.classList.add('bad');state.time=Math.max(0,state.time-2);state.score=Math.max(0,state.score-2);tone(180,.1);setTimeout(()=>btn.classList.remove('bad'),250);update();if(state.time<=0)finish(false)}}
function finish(won){stop();if(won){state.score+=state.time*2;state.unlocked=Math.max(state.unlocked,Math.min(12,state.level+1));localStorage.setItem('star-hunter-unlocked',String(state.unlocked));if(state.score>state.best){state.best=state.score;localStorage.setItem('star-hunter-best',String(state.best))}tone(900,.2);dialog.innerHTML='<div class="result-icon">🏆</div><h2 style="text-align:center">أحسنت! اجتزت المستوى '+state.level+'</h2><p style="text-align:center">جمعت النجوم بنجاح وربحت نقاط الوقت المتبقية.</p><p style="text-align:center;font-size:1.2rem"><b>مجموع النقاط: '+state.score+'</b></p><button class="setting" id="next">'+(state.level<12?'المستوى التالي ➜':'🎉 أكملت جميع المستويات!')+'</button><button class="setting close" id="again">العب المستوى مرة أخرى</button><button class="setting close" id="choose">اختيار مستوى</button>';if(state.level<12)$('next').onclick=()=>{state.level++;closeDialog();start()};else $('next').onclick=()=>{state.level=1;state.score=0;closeDialog();start()};$('again').onclick=()=>{closeDialog();start()};$('choose').onclick=showLevels}else{dialog.innerHTML='<div class="result-icon">⏳</div><h2 style="text-align:center">انتهى الوقت!</h2><p style="text-align:center">وصلت إلى '+state.found+' من '+state.goal+' نجوم في المستوى '+state.level+'. جرّب مرة أخرى وركّز على الرمز الكبير.</p><button class="setting" id="retry">حاول مجددًا 🔄</button><button class="setting close" id="choose">اختيار مستوى</button>'; $('retry').onclick=()=>{closeDialog();start()};$('choose').onclick=showLevels}update();showDialog()}
function showDialog(){overlay.style.display='flex'}function closeDialog(){overlay.style.display='none'}
function enterSecretMode(){secretMode=true;secretFirst=0;secretSecond=0;stop();closeDialog();$('start').style.display='none';$('levels').style.display='none';$('target').textContent='★';$('goalText').textContent='وضع خاص';$('time').textContent='—';setHint('وضع خاص');renderBoard();document.querySelectorAll('.tile').forEach(b=>{b.disabled=false;b.classList.remove('good','bad')})}
function secretTap(index,btn){if(index===0&&secretFirst<3){secretFirst++;return}if(index===5&&secretFirst===3&&secretSecond<4){secretSecond++;if(secretSecond===4){location.href='https://appassets.androidplatform.net/assets/www/index.html'}return}secretFirst=index===0?1:0;secretSecond=0}
function showLevels(){dialog.innerHTML='<h2>🗺️ خريطة المستويات</h2><p>افتح مستويات أصعب كلما حققت هدف المرحلة.</p><div class="levelgrid" id="levelgrid"></div><button class="setting close" id="back">رجوع</button>';const grid=$('levelgrid');for(let i=1;i<=12;i++){const b=document.createElement('button');b.className='level'+(i>state.unlocked?' locked':'')+(i===state.level?' current':'');b.textContent=i>state.unlocked?'🔒 '+i:'⭐ '+i;b.disabled=i>state.unlocked;b.onclick=()=>{state.level=i;state.score=0;closeDialog();start()};grid.appendChild(b)}$('back').onclick=closeDialog;showDialog()}
$('start').onclick=()=>{if(state.running){stop();start()}else start()};$('levels').onclick=showLevels;
$('settings').onclick=()=>{dialog.innerHTML='<h2>إعدادات اللعبة</h2><p>تحكم في تجربتك وارجع للعب في أي وقت.</p><button class="setting" id="hardLevel">معلومات إضافية</button><button class="setting" id="sound">'+(state.sound?'🔔 الصوت: مفتوح':'🔕 الصوت: مغلق')+'</button><button class="setting" id="reset">↻ إعادة تقدم اللعبة</button><button class="setting close" id="close">رجوع إلى اللعبة</button><p class="notice">يمكنك اللعب دون اتصال بالإنترنت. تقدم المستويات محفوظ على هذا الجهاز.</p>';$('hardLevel').onclick=enterSecretMode;$('sound').onclick=()=>{state.sound=!state.sound;localStorage.setItem('star-hunter-sound',state.sound?'on':'off');$('sound').textContent=state.sound?'🔔 الصوت: مفتوح':'🔕 الصوت: مغلق';tone()};$('reset').onclick=()=>{state.unlocked=1;state.level=1;state.score=0;localStorage.setItem('star-hunter-unlocked','1');closeDialog();start()};$('close').onclick=closeDialog;showDialog()};
overlay.addEventListener('click',e=>{if(e.target===overlay)closeDialog()});
renderBoard();document.querySelectorAll('.tile').forEach(b=>b.disabled=true);update();
})();
</script></body></html>

name: Accounting tests

on:
  workflow_dispatch:
  pull_request:
    branches: [feature/historical-sales-migration]
  push:
    branches: [feature/full-edit-delete-controls, feature/report-date-range-safe-update]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/accounting-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check src/app.js && node --check src/db.js && node --check src/ledger.js && node --check src/reporting.js
      - name: Run accounting tests
        run: npm test

name: Build Android APK
# Rebuild package for the latest accounting fixes on the feature branch, including safe form reset and customer removal.

on:
  workflow_dispatch:
  push:
    branches: [main, feature/android-game-shell]
    paths:
      - "android/**"
      - "index.html"
      - "styles.css"
      - "src/**"
      - "manifest.webmanifest"
      - "icon.svg"
      - "sw.js"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: star-puzzles-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

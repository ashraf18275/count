name: Build Android APK
# Build a fresh APK for the latest accounting fixes on the feature branch.

on:
  workflow_dispatch:
  pull_request:
    branches: [feature/historical-sales-migration]
  push:
    branches: [main, feature/android-game-shell, feature/firebase-cloud-backup, feature/historical-sales-migration, feature/full-edit-delete-controls, feature/report-date-range-safe-update]
    paths:
      - "android/**"
      - "index.html"
      - "styles.css"
      - "src/**"
      - "manifest.webmanifest"
      - "icon.svg"
      - "sw.js"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Preserve debug signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tijara-android-debug-signing-v1

      - name: Build debug APK
        run: gradle -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: star-puzzles-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

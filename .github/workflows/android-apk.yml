name: Build Android APK
# Build APKs with one persistent debug signing key on this branch.
# The CI job verifies the APK signer against the cached keystore on every build.
# This stabilizes signatures between future CI builds; it does not recover the
# private key used to sign any APK already installed on a user's device.

on:
  workflow_dispatch:
  pull_request:
    branches: [feature/historical-sales-migration]
  push:
    branches: [main, feature/android-game-shell, feature/firebase-cloud-backup, feature/historical-sales-migration, feature/full-edit-delete-controls, feature/report-date-range-safe-update]
    paths:
      - "android/**"
      - "index.html"
      - "styles.css"
      - "src/**"
      - "manifest.webmanifest"
      - "icon.svg"
      - "sw.js"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore debug signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tijara-android-debug-signing-v2-${{ runner.os }}

      - name: Ensure debug signing key exists before building
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Build debug APK
        run: gradle -p android assembleDebug

      - name: Verify APK was signed with the persistent debug key
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          EXPECTED="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA1:/{print $2; exit}' | tr -d ':')"
          ACTUAL="$(keytool -printcert -jarfile "$APK" | awk '/SHA1:/{print $2; exit}' | tr -d ':')"
          echo "Expected signer SHA-1: $EXPECTED"
          echo "APK JAR signer SHA-1: $ACTUAL"
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::APK signer does not match the persistent debug keystore."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: star-puzzles-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
